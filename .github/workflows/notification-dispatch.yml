name: Despachar notificaciones Brasa

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Procesar notificaciones pendientes
        env:
          CRON_SECRET: ${{ secrets.BRASA_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://brasa-eventos.vercel.app/api/cron/notifications
